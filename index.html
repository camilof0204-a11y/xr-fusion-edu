<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XR Fusion Edu - PC</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
body{background:#0a1628;color:white;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}
model-viewer{width:90vw;max-width:800px;height:500px;background:#111;border-radius:20px}
input,button{padding:12px;border-radius:10px;border:none;margin:5px}
input{width:400px;max-width:80vw}
button{background:#7cf7a6;color:#000;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h1>XR Fusion Edu - Visor PC</h1>
<model-viewer id="viewer" camera-controls auto-rotate ar shadow-intensity="1" alt="Modelo PC"></model-viewer>
<div style="margin-top:15px">
<input id="modelUrl" type="text" placeholder="URL del GLB" value="https://modelviewer.dev/shared-assets/models/Astronaut.glb">
<button id="btnCargar">Cargar</button>
</div>
<p id="estado">Listo para cargar</p>

<script>
const viewer = document.getElementById('viewer');
const input = document.getElementById('modelUrl');
const btn = document.getElementById('btnCargar');
const estado = document.getElementById('estado');

function cargarModelo(url){
  if(!url) return;
  estado.textContent = "Cargando: " + url;
  viewer.src = url;
  viewer.addEventListener('load', ()=>{ estado.textContent = "¡Modelo cargado!"; }, {once:true});
  viewer.addEventListener('error', (e)=>{ estado.textContent = "Error cargando modelo. Prueba otro link."; console.error(e); }, {once:true});
}

btn.addEventListener('click', ()=>{ cargarModelo(input.value.trim()); });

// Carga automática del PC
window.addEventListener('load', ()=>{
  const pcUrl = "https://raw.githubusercontent.com/rocksdanister/system-stats-wallpaper/main/src/Simple%20System%203D/models/pcmr.glb";
  input.value = pcUrl;
  cargarModelo(pcUrl);
  // Si falla por CORS, usa el astronauta como respaldo
  setTimeout(()=>{
    if(!viewer.src || estado.textContent.includes("Error")){
      cargarModelo("https://modelviewer.dev/shared-assets/models/Astronaut.glb");
    }
  }, 3000);
});
</script>
</body>
</html>
